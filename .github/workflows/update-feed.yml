
name: Update COD News and Rumours RSS Feeds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install feedparser googlenewsdecoder==0.2.2

      - name: Build COD News RSS feed
        run: python build_feed.py

      - name: Build COD Rumours and Leaks RSS feed
        run: python build_cod_rumours.py

      - name: Save updated RSS feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml cod-rumours.xml
          git diff --cached --quiet || git commit -m "Update COD news and rumours RSS feeds"
          git pull --rebase origin main
          git push
